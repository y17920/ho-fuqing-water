name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release with zip asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import json; print(json.load(open('custom_components/fuqing_water/manifest.json'))['version'])")
          echo "tag=$tag manifest=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match manifest version $version"
            exit 1
          fi

      - name: Build fuqing_water.zip
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          src = pathlib.Path("custom_components/fuqing_water")
          skip = {"__pycache__"}
          with zipfile.ZipFile("fuqing_water.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(src.rglob("*")):
                  if not path.is_file():
                      continue
                  if skip & set(path.parts) or path.suffix in {".pyc", ".pyo"}:
                      continue
                  zf.write(path, path.relative_to(src).as_posix())
          PY
          unzip -l fuqing_water.zip

      - name: Verify zip layout
        run: |
          python - <<'PY'
          import sys
          import zipfile

          names = set(zipfile.ZipFile("fuqing_water.zip").namelist())
          required = {"manifest.json", "__init__.py", "const.py"}
          missing = required - names
          if missing:
              sys.exit(f"zip 根目录缺少 {sorted(missing)}：HACS 会解压到 custom_components/fuqing_water/，不允许再套一层目录")
          print("zip layout OK")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" fuqing_water.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" fuqing_water.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
